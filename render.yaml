# Render Blueprint – one-click deploy (free tier compatible)
# https://render.com/docs/blueprint-spec

databases:
  - name: airport-media-db
    plan: free
    databaseName: airport_media
    user: airport

services:
  # ---------- Backend API ----------
  - type: web
    name: airport-media-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: airport-media-db
          property: connectionString
      - key: FLIGHT_SOURCE
        value: mock-aidx
      - key: SIMULATION_START
        value: "2026-10-24T13:00:00Z"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: CORS_ORIGIN
        sync: false

  # ---------- Frontend ----------
  - type: web
    name: airport-media-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx vite preview --host 0.0.0.0 --port $PORT
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_WS_URL
        sync: false
      - key: NODE_ENV
        value: production